name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --locked
      - name: Build release
        run: cargo build --locked --release
      - name: Verify version and package
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          expected="cpuclamp ${TAG_NAME#v}"
          actual=$(./target/release/cpuclamp --version)
          if [ "$actual" != "$expected" ]; then
            echo "Tag $TAG_NAME does not match binary version: $actual" >&2
            exit 1
          fi
          tar -czf "cpuclamp-${TAG_NAME}-x86_64-unknown-linux-gnu.tar.gz" \
            -C target/release cpuclamp -C ../.. README.md LICENSE
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            "cpuclamp-${TAG_NAME}-x86_64-unknown-linux-gnu.tar.gz" \
            --verify-tag --generate-notes --title "$TAG_NAME"
